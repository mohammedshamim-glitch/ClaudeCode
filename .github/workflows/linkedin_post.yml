name: LinkedIn Post

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Post message'
        required: true
        type: string
      tag:
        description: 'Result tag'
        required: true
        type: string
      image_url:
        description: 'Optional image URL to attach'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: pip install requests
      - name: Post to LinkedIn
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_MEMBER: ${{ secrets.LINKEDIN_MEMBER_ID }}
          MESSAGE: ${{ inputs.message }}
          TAG: ${{ inputs.tag }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: python3 scripts/li_post.py
      - name: Commit result
        run: |
          git config user.name 'github-actions'
          git config user.email 'actions@github.com'
          git add -f linkedin_results/
          git commit -m "LinkedIn result: ${{ inputs.tag }}" || echo "no changes"
          git push
