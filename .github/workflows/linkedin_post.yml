name: LinkedIn Post

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Post message'
        required: true
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post to LinkedIn
        run: |
          curl -s -X POST https://api.linkedin.com/v2/ugcPosts \
            -H "Authorization: Bearer ${{ secrets.LINKEDIN_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -d "$(cat <<EOF
          {
            \"author\": \"urn:li:person:${{ secrets.LINKEDIN_MEMBER_ID }}\",
            \"lifecycleState\": \"PUBLISHED\",
            \"specificContent\": {
              \"com.linkedin.ugc.ShareContent\": {
                \"shareCommentary\": {\"text\": $(echo '${{ inputs.message }}' | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')},
                \"shareMediaCategory\": \"NONE\"
              }
            },
            \"visibility\": {\"com.linkedin.ugc.MemberNetworkVisibility\": \"PUBLIC\"}
          }
          EOF
          )" | tee /tmp/response.json
          cat /tmp/response.json
